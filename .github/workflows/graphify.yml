name: Aggiorna graphify
on:
  push:
    branches: [main]
    paths-ignore: ['graphify-out/**']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install graphifyy==0.9.106 && graphify update .
      - name: Commit del grafo se cambiato
        run: |
          git config user.name "graphify-bot"
          git config user.email "graphify-bot@users.noreply.github.com"
          git add graphify-out
          git diff --cached --quiet || (git commit -m "chore: aggiorna graphify [skip ci]" && git push)
